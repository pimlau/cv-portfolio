name: CI
# Test change (test/ci-pipeline branch): confirming this workflow runs on a real PR.
# Safe to ignore/remove once verified.

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run build
